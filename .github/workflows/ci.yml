name: CI

on:
  pull_request: {}
  push:
    branches: [main]

jobs:
  tests:
    name: Format and Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10']
    env:
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: |
          pip install --upgrade pip
          pip install --upgrade poetry

      - name: Install dependencies
        shell: bash
        run: poetry install

      - name: Format check
        shell: bash
        run: poetry run format-check

      - name: Lint
        shell: bash
        run: poetry run lint

      - name: Type Check
        shell: bash
        run: poetry run type-check

      - name: Unit test
        shell: bash
        run: poetry run test

  # Stable name for branch protection. Keep this job if the Python/OS matrix changes.
  ci-success:
    name: CI success
    if: always()
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Confirm all matrix jobs succeeded
        run: test "${{ needs.tests.result }}" = "success"
